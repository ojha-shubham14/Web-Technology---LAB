<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset ="UTF-8">
	<meta name="viewport" content="width=device-width , initial-scale= 1.0">
	<title>1AY24CS201</title>

	<style>
		.container{
			max-width: 800px;
			margin: 0 auto;
		}
		button{
			font-size:medium;
			width: 100%;
			border-radius: 5px;
			border: none;
			padding:5px;
			margin:3px;
		}
		table{
			font-family: times New roman;
			width: 100%;
		}
		table td{
			padding:10px;
		}
		h1{
			text-align: center;
			color:burlywood;
		}
	</style>
</head>

<body>
	<div class = "container">

		<h1>Student Registration Form</h1>

		<form action = " https://httpbin.org/post" method="post">
			
			<table>

				<!-- first name -->
				<tr>
					<td>
						<lable for="firstName">First Name:</lable> 
					</td>

					<td>
						<input type="text" name="firstName" id="firstName" placeholder="Enter your first name" required>
					</td>
				</tr>

				<!-- last name -->
				<tr>
					<td>
						<label for="lastname">Last Name:</label>
					</td>

					<td>
						<input type="text" name="lastname" id="lastname" placeholder="Enter your last name" required>
					</td>
				</tr>

				<!-- gender -->

				<tr>
					<td class="legend">Gender:</td>

					<td>
						<input type="radio" name="gender" id="male" value="Male">
						<label for="male">Male</label>
						
						<input type="radio" name="gender" id="female" value="Female">
						<label for="female">Female</label>
					</td>
				</tr>

				<!-- age -->
				<tr>
					<td>
						<label for="age">Age:</label>
					</td>

					<td>
						<input type="number" name="age" id="age" min="15" max="25" step="1" placeholder="Age">
					</td>
				</tr>

				<!-- DOB -->

				<tr>
					<td>
						<label for="dob" >DOB:</label> 
					</td>

					<td>
						<input type="date" name="dob" id="dob" required>
					</td>
				</tr>

				<!-- Email address-->

				<tr>
					<td>
						<label for="email">E-Mail:</label>
					</td>
					<td>
						<input type="text" name="email" id="email" placeholder="Enter your Email" required>
					</td>
				</tr>

				<!--Password-->

				<tr>
					<td>
						<label for="password">Password:</label>
					</td>

					<td>
						<input type="password" name="password" id="password" placeholder="Enter Your password" required>
					</td>
				</tr>

				<!--Phone Number-->

				<tr>
					<td>
						<label for="tel">Phone No.:</label>
					</td>

					<td>
						<input type="tel" name="tel" id="tel" placeholder="Enter your phone number" pattern="[0-9]{10} required">
					</td>
				</tr>

				<!--Address-->

				<tr>
					<td>
						<label for="add">Address:</label>
					</td>

					<td>
						<textarea name="add" id="add" placeholder="Enter your address" required"></textarea>
					</td>
				</tr>

				<!--State-->

				<tr>
					<td>
						<label for="state">State</label>
					</td>

					<td>
						<input type="text" name="state" id="state" list="state-list" placeholder="Enter your state">
						<datalist id="state-list">
							<option value="KA"></option>
							<option value="AP"></option>
							<option value="WB">
							<option value="TN">
							<option value="UK">
						</datalist>
					</td>
				</tr>


				<tr>
                    <td class="legend">Hobbies:</td>

                    <td>
                        <input type="checkbox" name="Hobbies" id="Music" value="Music">
                        <label for="Music">Music</label>
                        <!-- Checkbox for Music -->

                        <input type="checkbox" name="Hobbies" id="Movies" value="Movies">
                        <label for="Movies">Movies</label>
                        <!-- Checkbox for Movies -->

                        <input type="checkbox" name="Hobbies" id="Sports" value="Sports">
                        <label for="Sports">Sports</label>
                        <!-- Checkbox for Sports -->

                        <input type="checkbox" name="Hobbies" id="Travel" value="Travel">
                        <label for="Travel">Travel</label>
                        <!-- Checkbox for Travel.
                             Checkboxes allow multiple selections. -->
                    </td>
                </tr>

				<tr>
					<td colspan="2">
						<button type="submit" style="background-color: aqua; color:white">Submit</button>
						<p></p>
						<button type="reset" style="background-color: red; color: white;">Reset</button>
					</td>
				</tr>
			</table>
		</form>
	</div>
</body>
</html>
